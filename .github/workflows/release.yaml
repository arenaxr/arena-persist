name: Release to Docker Hub

on:
  release:
    types:
      - published
  workflow_dispatch:
      
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 'Get Previous tag'
        id: get_tag
        uses: WyriHaximus/github-action-get-previous-tag@83f26fea93bc7efcbca2eb5591f5eaaf66b8f206 # v2.1.0
        with:
          fallback: latest # Optional fallback tag to use when no tag can be found
                
      - name: Build and push Docker image
        id:   docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |
            chash=${{ github.sha }}
            version=${{ steps.get_tag.outputs.tag }}
          push: true
          tags:  ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}, ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.get_tag.outputs.tag }} 

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
